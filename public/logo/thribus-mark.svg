<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Thribus Platform">
  <!--
    Thribus Platform — símbolo "Delta".
    Δ é o símbolo de mudança em engenharia e matemática: somos quem muda o
    estado do problema. O ápice dourado é o resultado entregue.
    Cores: tokens do design system (creme, gold, brand green).
  -->
  <defs>
    <linearGradient id="t-tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#142014"/>
      <stop offset="1" stop-color="#090e09"/>
    </linearGradient>
    <linearGradient id="t-gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e2c684"/>
      <stop offset="1" stop-color="#c6a45a"/>
    </linearGradient>
    <!-- recorte: abre um vão limpo entre o triângulo e o ápice dourado -->
    <mask id="t-apex">
      <rect width="64" height="64" fill="#fff"/>
      <path d="M23 26.5 L32 11 L41 26.5" fill="none" stroke="#000" stroke-width="10.5" stroke-linecap="round" stroke-linejoin="round"/>
    </mask>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#t-tile)" stroke="#6b8f5e" stroke-opacity=".4" stroke-width="1"/>
  <path d="M8 53 H56 L32 11 Z" fill="none" stroke="#f0ece2" stroke-width="6" stroke-linejoin="round" mask="url(#t-apex)"/>
  <path d="M23 26.5 L32 11 L41 26.5" fill="none" stroke="url(#t-gold)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
