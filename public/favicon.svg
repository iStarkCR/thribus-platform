<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Thribus Platform">
  <!--
    Thribus Platform — símbolo.
    Conceito: uma "tribo" de três colaboradores digitais (nós creme) conectados
    pela plataforma (hub dourado). A estrutura forma um "T" de Thribus.
    Cores: tokens do design system (brand-dim → brand, gold, creme).
  -->
  <defs>
    <linearGradient id="t-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4a7a3d"/>
      <stop offset="1" stop-color="#6b8f5e"/>
    </linearGradient>
    <linearGradient id="t-gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e2c684"/>
      <stop offset="1" stop-color="#c6a45a"/>
    </linearGradient>
  </defs>

  <rect width="64" height="64" rx="16" fill="url(#t-bg)"/>

  <!-- conexões -->
  <path d="M16 21H48M32 21V45" fill="none" stroke="#f0ece2" stroke-width="4.5" stroke-linecap="round"/>

  <!-- colaboradores -->
  <circle cx="16" cy="21" r="5" fill="#f0ece2"/>
  <circle cx="48" cy="21" r="5" fill="#f0ece2"/>
  <circle cx="32" cy="45" r="5" fill="#f0ece2"/>

  <!-- hub: a plataforma -->
  <circle cx="32" cy="21" r="8" fill="#55814a"/>
  <circle cx="32" cy="21" r="5.75" fill="url(#t-gold)"/>
</svg>
